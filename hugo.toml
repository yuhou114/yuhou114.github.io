baseURL = "https://yuhou114.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-CN"
title = "yuhou's Blog"
theme = "hugo-theme-reimu"
hasCJKLanguage = true
enableGitInfo = false
enableEmoji = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/:year:month:day/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]

[params]
  author = "yuhou"
  email = ""
  description = "记录学习与思考"
  mainSections = ["post"]
  banner = "images/banner.webp"
  avatar = "avatar.jpg"
  cover = ""
  toc = true
  excerpt_link = "Read More"

  [params.footer]
    since = 2026
    powered = true
    count = true
    busuanzi = true

  [params.sidebar]
    position = "right"
    menu = true
    [params.sidebar.article]
      show_common = true

  [params.dark_mode]
    enable = "auto"

  [params.code_block]
    expand = true

  [params.preloader]
    enable = false

  [params.firework]
    enable = true
    disable_on_mobile = false

  [params.reimu_cursor]
    enable = true

  [params.pace]
    enable = true

  [params.quicklink]
    enable = true

  [params.pjax]
    enable = true

  [params.animation]
    enable = true

  [params.top]
    enable = true
    position = "right"

  [params.comment]
    default = "waline"

[languages.zh-CN]
  label = "简体中文"
  weight = 1
  hasCJKLanguage = true

[menus]
  [[menus.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "archives"
    url = "/archives"
    weight = 2
  [[menus.main]]
    name = "about"
    url = "/about"
    weight = 3
  [[menus.main]]
    name = "friend"
    url = "/friend"
    weight = 4
