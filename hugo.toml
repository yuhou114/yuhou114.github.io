baseURL = "https://yuhou114.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-CN"
title = "yuhou's Blog"
theme = "hugo-theme-reimu"
hasCJKLanguage = true
enableGitInfo = false
enableEmoji = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/:year:month:day/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]

[params]
  author = "yuhou"
  email = ""
  description = "记录学习与思考"
  mainSections = ["post"]
  banner = "images/banner.webp"
  avatar = "avatar.jpg"
  cover = ""
  toc = true
  excerpt_link = "Read More"

  [params.footer]
    since = 2026
    powered = true
    count = true
    busuanzi = true

  [params.sidebar]
    position = "right"
    menu = true
    [params.sidebar.article]
      show_common = true

  [params.social]
    github = "https://github.com/yuhou114"

  [params.triangle_badge]
    enable = true
    icon = "github"
    link = "https://github.com/yuhou114"

  [params.dark_mode]
    enable = "auto"

  [params.code_block]
    expand = true

  [params.preloader]
    enable = false

  [params.firework]
    enable = true
    disable_on_mobile = false

  [params.reimu_cursor]
    enable = true

  [params.pace]
    enable = true

  [params.quicklink]
    enable = true

  [params.pjax]
    enable = true

  [params.animation]
    enable = true

  [params.top]
    enable = true
    position = "right"

  widgets = ["tagcloud"]

  [params.home_categories]
    enable = true
    [[params.home_categories.content]]
      categories = "计算机工具"
    [[params.home_categories.content]]
      categories = "杂谈"

  [params.injector]
    head_end = '<link rel="stylesheet" href="https://npm.webcache.cn/aplayer@1.10.1/dist/APlayer.min.css">'
    body_end = '<script src="https://npm.webcache.cn/aplayer@1.10.1/dist/APlayer.min.js"></script><script src="https://npm.webcache.cn/meting@2.0.1/dist/Meting.min.js"></script>'
    sidebar_begin = '<meting-js theme="var(--color-link)" id="2265921590" server="netease" type="playlist" fixed="false" order="random" list-folded="true"></meting-js>'

  [params.comment]
    default = "waline"

[languages.zh-CN]
  label = "简体中文"
  weight = 1
  hasCJKLanguage = true

[languages.en]
  label = "English"
  weight = 2
  hasCJKLanguage = false

[menus]
  [[menus.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "archives"
    url = "/archives"
    weight = 2
  [[menus.main]]
    name = "about"
    url = "/about"
    weight = 3
  [[menus.main]]
    name = "friend"
    url = "/friend"
    weight = 4
