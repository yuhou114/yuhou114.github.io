baseURL = "https://yuhou114.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh-CN"
title = "yuhou's Blog"
theme = "hugo-theme-reimu"
hasCJKLanguage = true
enableGitInfo = false
enableEmoji = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/:year:month:day/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    guessSyntax = true
    noClasses = false

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = true
mediaType = "application/json"
notAlternative = true


[params]
  author = "yuhou"
  email = ""
  description = "记录学习与思考"
  mainSections = ["post"]
  banner = "https://yuhou-hugo.oss-cn-beijing.aliyuncs.com/%E5%B0%81%E9%9D%A2%E5%9B%BE%E7%89%87/download/53e2cb5c5a243add4bfb67c54d1ecb68161775300.png"
  avatar = "avatar.jpg"
  cover = ""
  toc = true
  excerpt_link = "Read More"

  [params.footer]
    since = 2026
    powered = true
    count = true
    busuanzi = true

  [params.sidebar]
    position = "right"
    menu = true
    [params.sidebar.article]
      show_common = true

  [params.social]
    github = "https://github.com/yuhou114"

  [params.triangle_badge]
    enable = true
    icon = "github"
    link = "https://github.com/yuhou114"

  [params.dark_mode]
    enable = "auto"

  [params.code_block]
    expand = true

  [params.preloader]
    enable = false

  [params.firework]
    enable = true
    disable_on_mobile = false

  [params.reimu_cursor]
    enable = true

  [params.pace]
    enable = true

  [params.quicklink]
    enable = true

  [params.pjax]
    enable = true

  [params.animation]
    enable = true

  [params.top]
    enable = true
    position = "right"

  widgets = ["tagcloud"]

  [params.home_categories]
    enable = true
    [[params.home_categories.content]]
      categories = "科技周报"
    [[params.home_categories.content]]
      categories = "计算机工具"

  [params.injector]
    head_end = '<link rel="stylesheet" href="https://npm.webcache.cn/aplayer@1.10.1/dist/APlayer.min.css"><style>#logo,#subtitle{color:var(--red-0)!important}.article-nav-link-wrap img{opacity:1!important}</style>'
    body_end = '<script src="https://npm.webcache.cn/aplayer@1.10.1/dist/APlayer.min.js"></script><script>(function(){var API="https://api.injahow.cn/meting/?server=netease&type=playlist&id=7667652270&r=";var BATCH=20,THRESHOLD=5;var el=document.getElementById("lazy-player");if(!el||!window.APlayer||el.querySelector(".aplayer"))return;fetch(API+Math.random()).then(function(r){return r.json()}).then(function(data){for(var i=data.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=data[i];data[i]=data[j];data[j]=t}var tracks=data.map(function(s){return{name:s.name,artist:s.artist,url:s.url,cover:s.pic,lrc:s.lrc,theme:"var(--color-link)"}});var ap=new APlayer({container:el,theme:"var(--color-link)",loop:"all",order:"list",preload:"none",mutex:true,listFolded:true,listMaxHeight:"250px",storageName:"metingjs",lrcType:3,audio:tracks.slice(0,BATCH)});window._lazyAP=ap;var loaded=BATCH;var topUp=function(){if(loaded<tracks.length&&ap.list.index>=loaded-THRESHOLD){ap.list.add(tracks.slice(loaded,loaded+BATCH));loaded+=BATCH}};ap.on("play",topUp);ap.on("ended",topUp)}).catch(function(e){console.error("lazy-player init failed:",e)})})();</script>'
    sidebar_begin = '<div id="lazy-player"></div>'

  # Algolia Search API Key 是 Search-Only Key，仅用于前端搜索，可安全公开
  [params.algolia_search]
    enable = true
    appID = "IE6J7BAUTV"
    apiKey = "6136aa330590e2192ca146f997601a52"
    indexName = "hugo_yuhou"
    [params.algolia_search.hits]
      per_page = 10

  [params.comment]
    default = "waline"

[languages.zh-CN]
  label = "简体中文"
  weight = 1
  hasCJKLanguage = true

[menus]
  [[menus.main]]
    name = "home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "archives"
    url = "/archives"
    weight = 2
  [[menus.main]]
    name = "about"
    url = "/about"
    weight = 3
  [[menus.main]]
    name = "friend"
    url = "/friend"
    weight = 4
